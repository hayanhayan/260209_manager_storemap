<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#d9d9d4" />
  <title>PLIZ MUSIC SYNC</title>
  <style>
    :root{--paper:#f6f6f2;--ink:#202020;--bg:#d9d9d4;--muted:#696969}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font-family:"Courier New",monospace}.ticket{width:min(88vw,430px);padding:28px;border:2px solid var(--ink);background:var(--paper);box-shadow:8px 8px 0 rgba(0,0,0,.16);text-align:center}.brand{font-size:34px;font-weight:700;letter-spacing:-.08em}.copy{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.7}.bar{height:15px;margin-top:22px;padding:2px;border:2px solid var(--ink)}.bar i{display:block;width:20%;height:100%;background:repeating-linear-gradient(90deg,var(--ink) 0 7px,transparent 7px 9px);animation:load 1.1s steps(5,end) infinite}@keyframes load{to{width:100%}}
  </style>
</head>
<body>
  <main class="ticket" id="status">
    <div class="brand">PLIZ*</div>
    <div class="copy">MUSIC SYNC 영수증을 불러오고 있어요.</div>
    <div class="bar" aria-hidden="true"><i></i></div>
  </main>
  <script>
    (async () => {
      const source = "https://dnhwannjgmgubvmyvstx.supabase.co/functions/v1/pliz-live-v2";
      try {
        const response = await fetch(source, { cache: "no-store" });
        if (!response.ok) throw new Error(`서버 응답 ${response.status}`);
        const html = await response.text();
        if (!/^\s*<!doctype html>/i.test(html) || !html.includes("PLIZ")) {
          throw new Error("HTML 원본을 확인하지 못했어요.");
        }
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById("status").innerHTML = `
          <div class="brand">PLIZ*</div>
          <div class="copy">사이트를 불러오지 못했어요.<br><br>${String(error)}<br><br>잠시 뒤 새로고침해주세요.</div>`;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
