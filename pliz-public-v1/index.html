<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PLIZ MUSIC SYNC</title>
  <meta name="theme-color" content="#d9d9d4" />
  <style>
    html,body{height:100%;margin:0;background:#d9d9d4;color:#202020;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    body{display:grid;place-items:center}.ticket{width:min(82vw,420px);padding:26px;border:2px solid #202020;background:#f6f6f2;box-shadow:8px 8px 0 rgba(0,0,0,.16);text-align:center}
    .bar{height:12px;margin-top:18px;border:2px solid #202020;padding:2px}.bar i{display:block;height:100%;width:20%;background:repeating-linear-gradient(90deg,#202020 0 7px,transparent 7px 9px);animation:load 1.1s steps(5,end) infinite}
    small{display:block;margin-top:12px;line-height:1.6;color:#696969}@keyframes load{to{width:100%}}
  </style>
</head>
<body>
  <div class="ticket">PLIZ MUSIC SYNC LOADING…<div class="bar"><i></i></div><small>영수증 화면을 불러오고 있어요.</small></div>
  <script>
  (async()=>{
    const files=['part00.txt','part00b.txt','part01.txt','part02.txt','part03.txt','part04.txt','part05.txt'];
    try{
      const texts=await Promise.all(files.map(async file=>{
        const response=await fetch(new URL(file,location.href),{cache:'no-store'});
        if(!response.ok) throw new Error(`${file}: HTTP ${response.status}`);
        return (await response.text()).trim();
      }));
      const binary=atob(texts.join(''));
      const bytes=Uint8Array.from(binary,character=>character.charCodeAt(0));
      let html='';
      if('DecompressionStream' in window){
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        html=await new Response(stream).text();
      }else{
        await new Promise((resolve,reject)=>{
          const script=document.createElement('script');
          script.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
          script.onload=resolve;
          script.onerror=reject;
          document.head.appendChild(script);
        });
        html=new TextDecoder().decode(window.pako.ungzip(bytes));
      }
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML=`<div class="ticket">사이트를 불러오지 못했어요.<small>${String(error)}</small></div>`;
      console.error(error);
    }
  })();
  </script>
</body>
</html>
